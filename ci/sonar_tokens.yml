
sonarqube_tokens_report:
  image: alpine:3.20
  variables:
    SONAR_URL: "https://sonarqube.example.com"
    SONAR_ADMIN_TOKEN: "$SONAR_ADMIN_TOKEN"
  before_script:
    - apk add --no-cache curl jq coreutils
  script:
    # init CSVs without shell redirection edge cases
    - printf "user,token_name,token_type,project_key,created_at,expires_at,last_used_at\n" | tee user_tokens.csv >/dev/null
    - printf "project_key,token_name,owner_login,created_at,expires_at,last_used_at\n"      | tee project_tokens.csv >/dev/null

    # loop with plain /bin/sh
    - |
      page=1
      while :; do
        resp="$(curl -sS -H "Authorization: Bearer ${SONAR_ADMIN_TOKEN}" \
          "${SONAR_URL}/api/users/search?p=${page}&ps=500")"
        users="$(printf '%s' "$resp" | jq -r '.users[].login')"
        [ -z "$users" ] && break

        for u in $users; do
          curl -sS -H "Authorization: Bearer ${SONAR_ADMIN_TOKEN}" \
            "${SONAR_URL}/api/user_tokens/search?login=${u}" \
          | jq -r --arg u "$u" '.userTokens[] | [
              $u, .name, .type, (.project?.key // ""),
              .createdAt, (.expirationDate // ""), (.lastConnectionDate // "")
            ] | @csv' | tee -a user_tokens.csv >/dev/null
        done

        pi="$(printf '%s' "$resp" | jq -r '.paging.pageIndex')"
        ps="$(printf '%s' "$resp" | jq -r '.paging.pageSize')"
        total="$(printf '%s' "$resp" | jq -r '.paging.total')"
        if [ $(( pi * ps )) -ge "$total" ]; then break; fi
        page=$((page+1))
      done

    - tail -n +2 user_tokens.csv \
      | awk -F',' 'BEGIN{OFS=","} $3 ~ /PROJECT_ANALYSIS_TOKEN/ {print $4,$2,$1,$5,$6,$7}' \
      | tee -a project_tokens.csv >/dev/null
  artifacts:
    when: always
    paths:
      - user_tokens.csv
      - project_tokens.csv
    expire_in: 7 days

update_wiki_table_marked:
  image: python:3.12-alpine
  needs: []              # add jobs that produce the CSV if needed
  variables:
    PROJECT_ID: "$CI_PROJECT_ID"
    WIKI_TITLE: "SonarQube Tokens Report"      # page title to update
    MARK_START: "<!-- START:SONAR_TOKENS -->"
    MARK_END:   "<!-- END:SONAR_TOKENS -->"
    API_TOKEN: "$GITLAB_API_TOKEN"             # Project/Group token or PAT with api scope
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail
      # 1) Fetch page list; find slug by title
      SLUG=$(curl -sS --header "PRIVATE-TOKEN: ${API_TOKEN}" \
        "${CI_SERVER_URL}/api/v4/projects/${PROJECT_ID}/wikis" \
        | jq -r --arg t "$WIKI_TITLE" '.[] | select(.title==$t) | .slug')
      if [ -z "$SLUG" ]; then
        echo "Wiki page '$WIKI_TITLE' not found. Creating…"
        # create with just markers so we can update below
        BODY="${MARK_START}\n${MARK_END}"
        curl -sS --header "PRIVATE-TOKEN: ${API_TOKEN}" \
          --data-urlencode "title=${WIKI_TITLE}" \
          --data-urlencode "content=${BODY}" \
          "${CI_SERVER_URL}/api/v4/projects/${PROJECT_ID}/wikis" >/dev/null
        SLUG=$(curl -sS --header "PRIVATE-TOKEN: ${API_TOKEN}" \
          "${CI_SERVER_URL}/api/v4/projects/${PROJECT_ID}/wikis" \
          | jq -r --arg t "$WIKI_TITLE" '.[] | select(.title==$t) | .slug')
      fi

      # 2) Get current page content
      RAW=$(curl -sS --header "PRIVATE-TOKEN: ${API_TOKEN}" \
        "${CI_SERVER_URL}/api/v4/projects/${PROJECT_ID}/wikis/${SLUG}")
      CONTENT=$(echo "$RAW" | jq -r '.content')

      # 3) Build a Markdown table from CSV (first line is header)
      python - <<'PY' > table.md
import csv, sys
from pathlib import Path
csv_path = Path("user_tokens.csv")  # change if your CSV differs
if not csv_path.exists():
    sys.exit("CSV user_tokens.csv not found")
rows = list(csv.reader(csv_path.open()))
if not rows:
    sys.exit("CSV is empty")
hdr, data = rows[0], rows[1:]
def esc(s): return s.replace("|","\\|")
# build markdown
out = []
out.append("| " + " | ".join(esc(h) for h in hdr) + " |")
out.append("| " + " | ".join("---" for _ in hdr) + " |")
for r in data:
    # pad/truncate to header len
    r = (r + [""]*len(hdr))[:len(hdr)]
    out.append("| " + " | ".join(esc(c) for c in r) + " |")
print("\n".join(out))
PY

      NEW_TABLE=$(cat table.md)

      # 4) Splice table between markers
      if echo "$CONTENT" | grep -qF "${MARK_START}"; then
        ESC_START=$(printf '%s\n' "$MARK_START" | sed -e 's/[].*^$\/[]/\\&/g')
        ESC_END=$(printf '%s\n' "$MARK_END"   | sed -e 's/[].*^$\/[]/\\&/g')
        NEW_CONTENT=$(printf '%s' "$CONTENT" | awk -v s="$ESC_START" -v e="$ESC_END" -v t="$NEW_TABLE" '
          BEGIN{printed=0}
          {
            if ($0 ~ s) { print; print t; skip=1; next }
            if (skip && $0 ~ e) { print; skip=0; printed=1; next }
            if (!skip) print
          }
          END{
            if(!printed){
              print s; print t; print e;
            }
          }')
      else
        NEW_CONTENT="${CONTENT}\n\n${MARK_START}\n${NEW_TABLE}\n${MARK_END}\n"
      fi

      # 5) Update wiki page
      curl -sS --header "PRIVATE-TOKEN: ${API_TOKEN}" \
        --request PUT \
        --data-urlencode "content=${NEW_CONTENT}" \
        "${CI_SERVER_URL}/api/v4/projects/${PROJECT_ID}/wikis/${SLUG}" >/dev/null

      echo "Wiki table updated."


stages: [report]

sonar-loc-report:
  stage: report
  image: python:3.12-slim
  variables:
    GIT_STRATEGY: none
  script:
    - python3 ../scripts/sonar_scripts/loc.py
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - out/sonar_loc.csv
      - out/Sonar_LOC_Report.md
  rules:
    - when: on_success

stages: [report]

sonar-loc-report:
  stage: report
  image: python:3.12-slim
  variables:
    GIT_STRATEGY: fetch
    TOP_N: "25"               # tweak as needed
    MERMAID_MODE: "xy"        # set to "pie" if your wiki does not render xychart-beta
  before_script:
    - python --version
    - pip install --upgrade pip
  script:
    # Generate CSV and Mermaid Markdown
    - python scripts/gen_sonar_report.py

    # Push the chart page to the Wiki
    - export WIKI_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git"
    - git config --global user.email "ci-bot@${CI_SERVER_HOST}"
    - git config --global user.name "CI Bot"
    - git clone "$WIKI_URL" wiki
    - mkdir -p wiki/reports
    - cp out/sonar_loc_chart.md wiki/reports/sonar-loc.md
    - git -C wiki add reports/sonar-loc.md
    - git -C wiki commit -m "Update Sonar LOC Mermaid chart for ${CI_COMMIT_SHORT_SHA}" || echo "No changes"
    - git -C wiki push
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - out/sonar_loc.csv
      - out/sonar_loc_chart.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
